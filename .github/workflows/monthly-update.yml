name: Monthly data update

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated ISO3 codes to update (blank = all)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Refresh country data with Claude + web search
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-data.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
      - run: node scripts/validate.mjs
      # Changes land as a pull request so a human can review them before they go live.
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          title: 'Monthly political data update'
          commit-message: 'chore(data): monthly refresh'
          body-path: update-report.md
          add-paths: data/
